[package]
name = "rust-web-starter"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Karthik Kumar Viswanathan <karthikkumar@gmail.com>"]
description = "Minimal, fast-building Rust web server starter based on Rocket"
repository = "https://github.com/guilt/Rust-Web-Starter"
publish = false

[dependencies]
# HTTP/2 is off by default to keep the dependency tree small and builds fast.
# Enable it (and other Rocket features) as your app needs them:
# features = ["http2", "json", "tls"]
rocket = { version = "0.5.2", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_family, values("rust9x"))'] }

[patch.crates-io]
# mio9x: mio with rust9x / Windows 9x fallbacks (single-entry IOCP and no
# Vista-only AFD completion-mode flag). Normal targets use upstream behavior.
mio = { git = "https://github.com/guilt/mio9x.git", branch = "rust9x" }

# Fast local iteration: line-table debug info only, incremental compilation on.
[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

# Optimized binaries: thin LTO builds much faster than fat LTO while keeping
# most of the runtime benefit. Bump codegen-units down to 1 if you'd rather
# trade build time for the last few percent of runtime performance.
[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16
strip = "symbols"
