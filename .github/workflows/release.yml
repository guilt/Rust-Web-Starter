name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release builds are one-shot; keep the host-only sccache wrapper out of the
  # way (and out of cross's containers).
  RUSTC_WRAPPER: ""

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

  cross:
    name: Build cross
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build cross from git
        run: cargo install cross --git https://github.com/cross-rs/cross --locked --root "$GITHUB_WORKSPACE/.cross-bin"

      - name: Upload cross
        uses: actions/upload-artifact@v4
        with:
          name: cross-tool
          path: .cross-bin/bin/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    needs: [test, cross]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core targets: supported by every release.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, platform: linux-amd64, cross: true, experimental: false }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, platform: linux-arm64, cross: true, experimental: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, platform: windows-amd64, cross: false, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-15-intel, platform: darwin-amd64, cross: false, experimental: false }
          - { target: aarch64-apple-darwin, os: macos-15, platform: darwin-arm64, cross: false, experimental: false }

          # Experimental Linux architectures.
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, platform: linux-armv7, cross: true, experimental: true }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest, platform: linux-386, cross: true, experimental: true }
          - { target: riscv64gc-unknown-linux-musl, os: ubuntu-latest, platform: linux-riscv64, cross: true, experimental: true }
          - { target: powerpc64le-unknown-linux-gnu, os: ubuntu-latest, platform: linux-ppc64le, cross: true, experimental: true }
          - { target: s390x-unknown-linux-gnu, os: ubuntu-latest, platform: linux-s390x, cross: true, experimental: true }
          - { target: loongarch64-unknown-linux-musl, os: ubuntu-latest, platform: linux-loongarch64, cross: true, experimental: true }

          # Experimental BSD / Solaris family (cross, tier-2 std).
          - { target: x86_64-unknown-freebsd, os: ubuntu-latest, platform: freebsd-amd64, cross: true, experimental: true }
          - { target: aarch64-unknown-freebsd, os: ubuntu-latest, platform: freebsd-arm64, cross: true, experimental: true }
          - { target: i686-unknown-freebsd, os: ubuntu-latest, platform: freebsd-386, cross: true, experimental: true }
          - { target: x86_64-unknown-netbsd, os: ubuntu-latest, platform: netbsd-amd64, cross: true, experimental: true }
          - { target: x86_64-pc-solaris, os: ubuntu-latest, platform: solaris-amd64, cross: true, experimental: true }
          - { target: x86_64-unknown-illumos, os: ubuntu-latest, platform: illumos-amd64, cross: true, experimental: true }

          # Experimental Windows variants.
          - { target: i686-pc-windows-msvc, os: windows-latest, platform: windows-386, cross: false, experimental: true }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, platform: windows-arm64, cross: false, experimental: true }

          # Legacy Windows via rust9x (Windows XP+). Rocket/tokio hit a pre-main
          # CRT/std issue on XP, so this target builds the std-only legacy
          # server in src/bin/legacy.rs (same routes, blocking Winsock).
          - { target: i686-rust9x-windows-msvc, os: windows-latest, platform: windows-legacy-386, cross: false, rust9x: true, msvc_arch: x86, experimental: true }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ !matrix.rust9x }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up MSVC
        if: matrix.rust9x
        continue-on-error: ${{ matrix.experimental }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install rust9x toolchain
        if: matrix.rust9x
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "rust9x-1.100.0-v2"
          $archive = "$env:RUNNER_TEMP\rust9x.7z"
          Invoke-WebRequest -Uri "https://github.com/rust9x/rust/releases/download/$ver/$ver-x86_64-pc-windows-msvc.7z" -OutFile $archive
          7z x $archive "-o$env:RUNNER_TEMP\rust9x" -y | Out-Null
          $rustc = Get-ChildItem "$env:RUNNER_TEMP\rust9x" -Recurse -Filter rustc.exe | Select-Object -First 1
          $root = Split-Path (Split-Path $rustc.FullName -Parent) -Parent
          rustup toolchain link rust9x $root
          rustup run rust9x rustc --version
          "RUST9X_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare rust9x std source
        if: matrix.rust9x
        continue-on-error: ${{ matrix.experimental }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/rust9x-src"
          rm -rf "$SRC"
          git clone --depth 1 --filter=blob:none --sparse --branch rust9x-1.100.0-v2 https://github.com/rust9x/rust.git "$SRC"
          cd "$SRC"
          git sparse-checkout set library
          rm -rf library/backtrace
          git clone --depth 1 --branch rust9x-1.100 https://github.com/rust9x/backtrace-rs.git library/backtrace

      - name: Install rust9x std source
        if: matrix.rust9x
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUST9X_ROOT "lib/rustlib/src/rust"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP/rust9x-src/library" (Join-Path $dest "library")

      - name: Build r9xrsrt
        if: matrix.rust9x
        continue-on-error: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "r9xrsrt"
          if (-not (Test-Path $src)) {
            git clone --depth 1 https://github.com/rust9x/r9xrsrt.git $src
          }
          Push-Location $src
          $env:RUSTC_WRAPPER = ""
          cargo +rust9x build --release --target i686-rust9x-windows-msvc
          Pop-Location

      - name: Install cross
        if: matrix.cross
        uses: actions/download-artifact@v4
        with:
          name: cross-tool
          path: ${{ runner.temp }}/cross-bin

      - name: Add cross to PATH
        if: matrix.cross
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP"/cross-bin/*
          echo "$RUNNER_TEMP/cross-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cross-bin/cross" --version

      - name: Link Solaris libc compat shim
        if: matrix.target == 'x86_64-pc-solaris'
        shell: bash
        run: |
          echo "CARGO_TARGET_X86_64_PC_SOLARIS_RUSTFLAGS=-C link-arg=/compat.o" >> "$GITHUB_ENV"

      - name: Build
        id: build
        if: ${{ !matrix.rust9x }}
        shell: bash
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            # mold and sccache are host-only; cross has its own toolchain.
            rm -f .cargo/config.toml
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Build (rust9x)
        id: build_r9x
        if: matrix.rust9x
        shell: pwsh
        continue-on-error: ${{ matrix.experimental }}
        env:
          CARGO_TARGET_I686_RUST9X_WINDOWS_MSVC_RUSTFLAGS: >-
            -Zunicows=no -Clink-arg=/SUBSYSTEM:CONSOLE,4.0
            -Clink-arg=/STACK:8388608
            -Ctarget-feature=+crt-static
            -Clink-arg=/LIBPATH:${{ runner.temp }}/r9xrsrt/target/i686-rust9x-windows-msvc/release
        run: cargo +rust9x build --release --locked --bin legacy --config .cargo/rust9x.toml --config 'profile.release.panic="abort"' --target "${{ matrix.target }}"

      - name: Package
        if: ${{ steps.build.outcome == 'success' || steps.build_r9x.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe=".exe"; fi
          src="target/${{ matrix.target }}/release/rust-web-starter${exe}"
          if [[ "${{ matrix.rust9x }}" == "true" ]]; then
            src="target/${{ matrix.target }}/release/legacy.exe"
          fi
          mkdir -p dist
          dest="dist/rust-web-starter-${{ matrix.platform }}${exe}"
          cp "$src" "$dest"
          ls -lh "$dest"

      - name: Upload artifact
        if: ${{ steps.build.outcome == 'success' || steps.build_r9x.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-web-starter-${{ matrix.platform }}
          path: dist/rust-web-starter-${{ matrix.platform }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rust-web-starter-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum rust-web-starter-* > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rust-web-starter-*
            dist/checksums.txt
          generate_release_notes: true
