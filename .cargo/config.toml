# Link with mold on Linux. It is dramatically faster than the default linker
# for debug builds and is what makes local iteration feel instant.
#
# Install it first:
#   Debian/Ubuntu: sudo apt install mold
#   Fedora:        sudo dnf install mold
#   Arch:          sudo pacman -S mold
#   macOS:         brew install mold  (then use the commented block below)
#
# Don't have mold? Remove the matching target section and Rocket still builds
# fine with the system linker.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS: uncomment after installing mold (path may vary on Intel Macs).
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/bin/ld64.mold"]
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/bin/ld64.mold"]

# Shared compilation cache. Install sccache first:
#   cargo install sccache
# or grab a prebuilt binary: https://github.com/mozilla/sccache/releases
#
# Warm clean builds drop from ~11s to ~4s (debug) and ~15s to ~7s (release).
# The cache lives in ~/.cache/sccache (override with SCCACHE_DIR).
# Remove this block if you don't want sccache; builds will use plain rustc.
# CI sets SCCACHE_GHA_ENABLED=true to use the GitHub Actions cache backend.
[build]
rustc-wrapper = "sccache"
